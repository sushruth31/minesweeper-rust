[package]
name = "minesweeper"
version = "0.2.0"
edition = "2021"
description = "Minesweeper implemented in Rust, compiled to WebAssembly and rendered with Yew"
repository = "https://github.com/sushruth31/minesweeper-rust"
license = "MIT"
keywords = ["minesweeper", "game", "yew", "wasm"]
categories = ["games", "wasm"]

# The rules module is framework-free and builds for the host, so `cargo test`
# needs nothing but `rand`. Everything browser-shaped is wasm-only.
[dependencies]
rand = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
yew = "0.19"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
